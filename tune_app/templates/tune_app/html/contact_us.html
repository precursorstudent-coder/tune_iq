<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  {% include 'tune_app/common/common_css.html' %}
  <!-- start script** This script only for form in alpha or number validation -->
  <script>

    const alphaRegex = /^[A-Za-z\s]*$/;
    const numberRegex = /^[0-9]{0,10}$/;
    function checkAlpha(event) // event is an object
    {
      console.log(event)
      console.log(event.target)//the element on which event is occuring
      let data = event.target.value//text field ki value

      if (!alphaRegex.test(data)) // this is return me false but false opposite true because ! this expression
      {

        event.target.value = data.replace(/[^a-zA-Z ]/g, '');
        alert("Only alphabets are allowed ")

      }

    }//check Alpha Close




    //check digits


    function checkDigit(event) {

      let data = event.target.value

      if (!numberRegex.test(data)) {

        event.target.value = data.replace(/[^0-9]/g, '')
        alert("Only digits are allowed ")


      }

    }

  </script>

  <style>
    .form-div {
            width: 35%;
            height: auto;
            margin: auto;
            border-radius: 4%;
            padding: 35px;
            margin-top: 20%;
            margin-bottom: 8%;
            border:1px solid rgba(255,255,255,0.18);
            box-shadow:0 20px 60px rgba(0,0,0,0.35);
            background:rgba(255,255,255,0.06);
 
        
        }
        .form-div:hover {
            box-shadow: 0 0px 25px #00413d;
            transform: scale(1.02);
        }
  </style>
</head>

<body>
  {% include 'tune_app/user/owner_header.html' %}
  <div class="main-div" style="display: flex; align-items: center; justify-content: center; ">

    <form action="/contact/" method="post">
      {% csrf_token %}
      <div class="form-div" style="width: 500px;">

        <h1 style="text-align: center;color: #757474; font-family:'Times New Roman', Times, serif Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; font-weight: 700;">Contact</h1>
        <hr style="border-top: 2px solid rgb(196, 189, 189); margin: 15px 5px 25px;"> 
        

        <div class="form-floating mb-3">
          <input type="text" class="form-control" id="floatingInput" placeholder="name" name="name" required  oninput="checkAlpha(event)">
          <label for="floatingInput">Name</label>
        </div>

        <div class="form-floating mb-3" style=" display: block">
          <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com" name="email"
            required>
          <label for="floatingInput">Email address</label>
        </div>
        <div class="form-floating mb-3" style="display: block">
          <input type="text" class="form-control" id="floatingInput" placeholder="phone_number" name="phone" maxlength="10" required oninput="checkDigit(event)">
          <label for="floatingInput">Phone Number</label>
        </div>

        <div class="form-floating" style="display: block">
          <textarea class="form-control" placeholder="Leave a comment here" id="floatingTextarea2" style="height: 100px"
            name="query" required></textarea>
          <label for="floatingTextarea2">Question</label>
        </div>

        <div class="container-fluid d-flex justify-content-center" style=" margin-top: 16px;">
        <button class="btn btn-secondary" style="width: 100%;background-color:#113f3c;">Submit</button>

        </div>
      </div>
    </form>
  </div>

{% include 'tune_app/common/footer.html' %} 

</body>

</html>
