<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    {% include 'tune_app/common/common_css.html' %}
    <style>
        .flex-container{
            display: flex;
            align-items: center;
            justify-content: center;
            
            
        }

        .form-div{
            width: 28%;
            height: 55%;
            border-radius:4%;
            box-shadow:0 20px 60px rgba(0,0,0,0.35);
            background:rgba(255,255,255,0.06);
            border:1px solid rgba(255,255,255,0.18);
            padding: 25px;   
            margin-top:10%;
        }
        
        .form-div:hover {
            box-shadow: 0 0px 35px #00413d;
            transform: scale(1.02);
        }

    </style>
</head>
<body>
     {% include 'tune_app/common/header.html' %}
     {% include 'tune_app/common/message.html' %} 

    <div class="main-div">
        <div class="flex-container">
        
            <d iv class="form-div">
             <h1 style="text-align: center; color:  #757474; font-family:'Times New Roman', Times, serif Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; font-weight:700;">Login</h1>
             <hr style="border-top: 2px solid rgb(196, 189, 189); margin: 15px 5px 25px;"> 

            <form action="/admin_login/" method="post">
    {% csrf_token %}            
                 <div class="input-group mb-3" style="margin-top: 6%;">
                 <input type="text" class="form-control" placeholder="Enter Your Email"name="email" required>
                 <span class="input-group-text"><i class="fa-solid fa-envelope-open"></i></i></span>
                </div>
                 
                 <div class="input-group mb-3">
                 <input type="password" class="form-control" placeholder="Enter Your Password"name="password" required>
                 <span class="input-group-text"><i class="fa-solid fa-key"></i></span>
                </div>

                <div class="text-center mb-3">
                <button class="btn btn-secondary" style="width: 100%;background-color:rgb(98, 98, 98);">Sign In</button> <br>

                </div>
            </form>
            </div>
        
        </div>
 </div>
  
   
</body>
</html>
