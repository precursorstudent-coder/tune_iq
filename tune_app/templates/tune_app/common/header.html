{% load static %}
<style>
/* Navbar Links */
.navbar-nav .nav-link {
    position: relative;
    display: inline-block;
    color: #a9a5a5;
    transition: color 0.3s ease;
}

/* Hide underline by default */
.navbar-nav .nav-link::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 2px;
    width: 0;
    height: 2px;
    background: #d6e3f1; /* Change color if needed */
    transition: width 0.3s ease;
}

/* Show underline on hover */
.navbar-nav .nav-link:hover::after {
    width: 100%;
}

/* Remove underline from dropdown toggle */
.navbar-nav .dropdown-toggle::after {
    border: none; /* Keeps Bootstrap arrow from conflicting */
}

.navbar-nav .dropdown-toggle::before,
.navbar-nav .dropdown-toggle::after {
    content: none;
}

/* Dropdown Items */
.dropdown-menu .dropdown-item {
    position: relative;
    display: inline-block;
    transition: color 0.3s ease;
}

.dropdown-menu .dropdown-item::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 3px;
    width: 0;
    height: 2px;
    background: #00204f;
    transition: width 0.3s ease;
}

.dropdown-menu .dropdown-item:hover::after {
    width: 100%;
}
.nav-link{
    color: rgb(135, 132, 132) !important ;
    font-family: 'Poppins', 'Segoe UI', sans-serif;
    font-weight: 600;
    font-size: 18px !important;
    
}
</style>
